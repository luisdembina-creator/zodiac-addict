async function fetchWikiImage(searchName) {
    try {
        let url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(searchName)}&prop=pageimages&format=json&pithumbsize=600&origin=*`;
        let response = await fetch(url);
        let data = await response.json();
        let pages = data.query.pages;
        let pageId = Object.keys(pages)[0];
        
        if (pages[pageId].thumbnail && pages[pageId].thumbnail.source) {
            return pages[pageId].thumbnail.source;
        }
        return null;
    } catch (error) {
        return null;
    }
}

        load.innerText = "No Photo Found";
    }

    const shareText = `Zodiac Addict:\n🏆 Fame: ${fame}/10\n🔥 Chaos: ${chaos}/10\n✨ Charisma: ${charisma}/10\n\nMy celebrity twin is ${twin.name} (${twin.zodiac}).\n\n"${twin.quote}"\n\nRed flag: ${twin.redflag}`;
    document.getElementById('share').setAttribute('data-copy', shareText);
    document.getElementById('res-box').style.display = "block";
}

function copyRes() {
    navigator.clipboard.writeText(document.getElementById('share').getAttribute('data-copy')).then(() => {
        const btn = document.getElementById('share');
        btn.innerText = "Copied! ✅";
        setTimeout(() => { btn.innerText = "Copy Roast for TikTok/IG"; }, 2500);
    });
}
</script>
