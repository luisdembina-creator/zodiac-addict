<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zodiac Addict</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161d;
            --primary: #ff2a75;
            --secondary: #00ffcc;
            --warning: #ffcc00;
            --danger: #ff3333;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top, rgba(255, 42, 117, 0.15) 0%, transparent 50%);
        }
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; font-style: italic; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        select {
            width: 100%; padding: 14px; background-color: rgba(255,255,255,0.05); color: white;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 16px; outline: none; cursor: pointer; transition: border 0.3s; appearance: none;
        }
        select:focus { border-color: var(--primary); }
        select option { background-color: var(--card-bg); color: white; }
        button {
            width: 100%; padding: 16px; background: linear-gradient(90deg, var(--primary), #ff5599); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 20px rgba(255, 42, 117, 0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(255, 42, 117, 0.4); }
        #result-box { display: none; margin-top: 30px; background: rgba(0,0,0,0.4); border-radius: 16px; padding: 20px; border-left: 4px solid var(--secondary); text-align: left; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-label { font-size: 12px; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 5px; margin-top: 20px; }
        .result-label:first-child { margin-top: 0; }
        .result-content { font-size: 15px; line-height: 1.5; margin-bottom: 10px; color: #e4e4e7; }
        .stats-container { display: flex; justify-content: space-between; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; }
        .stat { text-align: center; flex: 1; }
        .stat-name { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
        .stat-value { font-size: 15px; font-weight: bold; }
        .val-green { color: var(--secondary); }
        .val-yellow { color: var(--warning); }
        .val-red { color: var(--danger); }
        #share-btn { background: rgba(255,255,255,0.1); color: white; box-shadow: none; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2); }
        #share-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zodiac Addict</h1>
        <p class="subtitle">"It's a roast, not a reading."</p>
        <div class="input-group">
            <label for="zodiac">Your Zodiac Sign</label>
            <select id="zodiac">
                <option value="Aries">Aries ♈</option>
                <option value="Taurus">Taurus ♉</option>
                <option value="Gemini">Gemini ♊</option>
                <option value="Cancer">Cancer ♋</option>
                <option value="Leo">Leo ♌</option>
                <option value="Virgo">Virgo ♍</option>
                <option value="Libra">Libra ♎</option>
                <option value="Scorpio">Scorpio ♏</option>
                <option value="Sagittarius">Sagittarius ♐</option>
                <option value="Capricorn">Capricorn ♑</option>
                <option value="Aquarius">Aquarius ♒</option>
                <option value="Pisces">Pisces ♓</option>
            </select>
        </div>
        <div class="input-group">
            <label for="mbti">Your MBTI Type</label>
            <select id="mbti">
                <option value="INTJ">INTJ (The Architect)</option>
                <option value="INTP">INTP (The Logician)</option>
                <option value="ENTJ">ENTJ (The Commander)</option>
                <option value="ENTP">ENTP (The Debater)</option>
                <option value="INFJ">INFJ (The Advocate)</option>
                <option value="INFP">INFP (The Mediator)</option>
                <option value="ENFJ">ENFJ (The Protagonist)</option>
                <option value="ENFP">ENFP (The Campaigner)</option>
                <option value="ISTJ">ISTJ (The Logistician)</option>
                <option value="ISFJ">ISFJ (The Defender)</option>
                <option value="ESTJ">ESTJ (The Executive)</option>
                <option value="ESFJ">ESFJ (The Consul)</option>
                <option value="ISTP">ISTP (The Virtuoso)</option>
                <option value="ISFP">ISFP (The Adventurer)</option>
                <option value="ESTP">ESTP (The Entrepreneur)</option>
                <option value="ESFP">ESFP (The Entertainer)</option>
            </select>
        </div>
        <button onclick="calculateMatch()">Reveal My Roast</button>
        <div id="result-box">
            <div class="stats-container">
                <div class="stat">
                    <div class="stat-name">Prestige</div>
                    <div class="stat-value" id="stat-prestige">0/10</div>
                </div>
                <div class="stat">
                    <div class="stat-name">Charisma</div>
                    <div class="stat-value" id="stat-charisma">0/10</div>
                </div>
                <div class="stat">
                    <div class="stat-name">Drama</div>
                    <div class="stat-value" id="stat-drama">0/10</div>
                </div>
            </div>
            <div class="result-label">Your Celebrity Twin</div>
            <div class="result-content" id="celeb-result">...</div>
            <div class="result-label">Your Ultimate Match</div>
            <div class="result-content" id="match-result">...</div>
            <button id="share-btn" onclick="copyResult()">Copy Roast for TikTok/IG</button>
        </div>
    </div>
    <script>
// --- THE DATA ---
        const celebrityTwins = [
            { name: "Stephen Fry", desc: "The ultimate national treasure. You are incredibly articulate, highly intelligent, and everyone wants you at their dinner party." },
            { name: "Dame Judi Dench", desc: "Absolute prestige. You command respect the second you walk into a room. You don't need to shout to be heard." },
            { name: "Barry from EastEnders", desc: "You are carrying a lot of emotional baggage and you probably need a pint. You are a legend in your own local pub." },
            { name: "Kanye West", desc: "A visionary, a genius, and an absolute PR disaster. You have zero filter and you will say what you want." },
            { name: "Tom Cruise", desc: "Unmatched dedication and insane charisma, but everyone knows you have some very strong, very specific beliefs." },
            { name: "Ozzy Osbourne", desc: "You are a rock legend who has survived things that should have destroyed you. You are chaotic but deeply lovable." },
            { name: "Kris Jenner", desc: "The ultimate momager. You are a ruthless business person and you will protect your inner circle at all costs." },
            { name: "Phil Mitchell (Soap Villain)", desc: "Grumpy, intimidating, and always involved in a scandal. You have a heart of gold buried under a lot of anger." },
            { name: "Sir Ian McKellen", desc: "Theatre royalty. You are witty, dramatic, and you give the best advice. A true master of your craft." },
            { name: "Katie Price", desc: "You are a tabloid staple. Impulsive, fiercely loyal, and you have lived about ten lives in one." },
            { name: "Boris Johnson", desc: "You somehow fail upwards. Your life is a chaotic mess, but you always find a way to survive and keep talking." },
            { name: "Victoria Beckham", desc: "High fashion, high standards. You don't smile much in public, but you are secretly hilarious and iconic." }
        ];

        const matchPool = [
            { match: "A disgraced politician who wants you to be their campaign manager.", vibe: "You will do all the work, they will take the credit." },
            { match: "A chaotic soap star who will start a fight at your family dinner.", vibe: "Expect a lot of dramatic exits and slammed doors." },
            { match: "A highly respected actor who is secretly a complete diva.", vibe: "You will have to hold their coat while they yell at the director." },
            { match: "A reality TV legend who is only with you for the camera time.", vibe: "Your relationship will be a PR stunt." },
            { match: "A rock star who is emotionally unavailable but writes amazing songs about you.", vibe: "You will be their muse, but never their priority." }
        ];

        const zodiacMood = {
            "Aries": "starting a fight in the middle of a wedding",
            "Taurus": "eating snacks while watching the drama unfold",
            "Gemini": "spreading rumors to the tabloids",
            "Cancer": "crying in the green room",
            "Leo": "demanding a bigger dressing room",
            "Virgo": "editing the reality show to make yourself look better",
            "Libra": "trying to be friends with everyone and failing",
            "Scorpio": "plotting your revenge",
            "Sagittarius": "getting kicked off the show for breaking the rules",
            "Capricorn": "trying to monetize your trauma",
            "Aquarius": "being the weird fan favorite",
            "Pisces": "falling in love with the wrong person on set"
        };

        // --- THE LOGIC ---
        function getRandom(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function calculateMatch() {
            const sign = document.getElementById('zodiac').value;
            const mbti = document.getElementById('mbti').value;
            
            let prestige = getRandom(5, 10);
            let charisma = getRandom(4, 10);
            let drama = getRandom(3, 10);

            if (mbti === "ESFP" || mbti === "ESTP") {
                drama = 10;
                charisma = Math.max(charisma, 8);
            }
            if (mbti === "ENTJ" || mbti === "ESTJ") {
                prestige = Math.max(prestige, 8);
            }
            if (mbti === "INFP" || mbti === "INFJ") {
                drama = Math.min(drama, 5);
                prestige = Math.max(prestige, 7);
            }

            let twin = celebrityTwins[Math.floor(Math.random() * celebrityTwins.length)];
            let match = matchPool[Math.floor(Math.random() * matchPool.length)];

            const prestigeEl = document.getElementById('stat-prestige');
            prestigeEl.innerText = prestige + "/10";
            prestigeEl.className = "stat-value " + (prestige >= 8 ? "val-green" : prestige >= 5 ? "val-yellow" : "val-red");

            const charismaEl = document.getElementById('stat-charisma');
            charismaEl.innerText = charisma + "/10";
            charismaEl.className = "stat-value " + (charisma >= 8 ? "val-green" : charisma >= 5 ? "val-yellow" : "val-red");

            const dramaEl = document.getElementById('stat-drama');
            dramaEl.innerText = drama + "/10";
            dramaEl.className = "stat-value " + (drama >= 8 ? "val-red" : drama >= 5 ? "val-yellow" : "val-green");

            const mood = zodiacMood[sign];
            
            document.getElementById('celeb-result').innerHTML = `<strong>${twin.name}</strong><br>${twin.desc}`;
            document.getElementById('match-result').innerHTML = `<strong>${match.match}</strong><br>${match.vibe} You are a ${sign} ${mbti}, which means you are ${mood}.`;

            const shareText = `Zodiac Addict (The Roast):\n🏆 Prestige: ${prestige}/10\n✨ Charisma: ${charisma}/10\n🎭 Drama: ${drama}/10\n\nMy celebrity twin is ${twin.name}! 😳\nApparently, I belong with: ${match.match}\n\nWhat's your vibe?`;
            
            document.getElementById('share-btn').setAttribute('data-copy', shareText);
            document.getElementById('result-box').style.display = "block";
        }

        function copyResult() {
            const textToCopy = document.getElementById('share-btn').getAttribute('data-copy');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('share-btn');
                btn.innerText = "Copied! Go paste it on TikTok ✅";
                btn.style.background = "var(--secondary)";
                btn.style.color = "#000";
                
                setTimeout(() => {
                    btn.innerText = "Copy Roast for TikTok/IG";
                    btn.style.background = "rgba(255,255,255,0.1)";
                    btn.style.color = "white";
                }, 2500);
            }).catch(err => {
                alert("Failed to copy. Please screenshot instead!");
            });
        }
    </script>
</body>
</html>
